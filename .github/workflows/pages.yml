name: Site

# Publishes site/ to GitHub Pages (marketplace.constructcraft.net), with an
# index.json built from plugins/*.toml at deploy time. It does not wait for the
# "Publish index" commit: pushes made with GITHUB_TOKEN start no workflows.
on:
  push:
    branches: [main]
    paths: ["plugins/**", "scripts/index.py", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: |
          python scripts/index.py build
          mkdir _site
          cp -r site/. _site/
          cp index.json _site/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

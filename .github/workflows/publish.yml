name: Publish index

# Rebuilds index.json, the file ConstructCraft reads, from plugins/*.toml.
on:
  push:
    branches: [main]
    paths: ["plugins/**", "scripts/index.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/index.py build
      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push
